fixture_id: b206mini_pi5_loopback_50m
description: B206mini-i loopback, 30 dB pad at TX, 50 m coax
status: commissioned
hardware:
  sdr_model: B206mini-i
  sdr_serial: "36B5C60"
  chain:                         # SDR TX -> SDR RX, in order (see orca_hil/fixtures.py),
                                 # as when the baselines were measured (2026-10)
    - {id: pad30, type: attenuator, loss_db: 30}
    - id: cable50
      type: cable
      model: LMR-100
      length_m: 50.0
      velocity_factor: 0.66
      source: measured           # S12, 2026-10-07 (radar-testbench hardware_reference/50m_loopback)
      loss_db: {freq_mhz: [100, 150, 200, 250, 300, 330, 350, 400, 450, 500, 600, 750, 900],
                value: [12.1, 14.4, 16.5, 18.4, 20.2, 21.2, 21.8, 23.4, 24.9, 26.4, 29.1, 32.7, 35.9]}
host:
  model: Raspberry Pi 5
  data_root: /mnt/nvme/orca-hil
  results_repo: ~/orca-hil-testing-results   # clone of englacial/orca-hil-testing-results
uhd:
  source_dir: ~/uhd
  install_prefix: ~/uhd-patched
  expected_commit: c87abfbe8fb96cd1dc9e5d10fcf50d792b60c452
  fpga_image: usrp_b205mini_fpga.bin   # the B206mini uses the B205mini image
  env:
    UHD_IMAGES_DIR: ~/uhd-patched/share/uhd/images
storage:
  kept_raw_quota_gb: 100
  run_retention_days: 60
safety:
  tx_gain_max: 89.8             # device maximum; the 30 dB pad keeps RX input far below damage
  # Power budget (orca_hil/fixtures.py): every capture is checked against these
  rx_max_input_dbm: -15         # conservative; the B206mini damage level is not verified
  power_margin_db: 3            # subtracted from every max input
  linear_margin_db: 3           # within this of P1dB / limiter threshold counts as nonlinear
  rx_clip_fraction_max: 0.9
  attenuator_check:
    tx_gain: 15.0                # set at commissioning
    expected_peak_dbfs: -72.1    # set at commissioning
    tolerance_db: 6
rf_base:
  freq: 330.0e6
  tx_gain: 35.0                  # set at commissioning
  rx_gain: 40.0                  # set at commissioning
calibration:
  # SDR TX output, measured with a scope through a splitter and 30 dB pad at 100 MHz
  # (radar-testbench pa_bringup/STATUS.md, 2026-11-05). Extrapolated at 1 dB/dB.
  tx_power_table:
    - {tx_gain: 53, dbm: -12.0}
    - {tx_gain: 62, dbm: -3.0}
    - {tx_gain: 72, dbm: 7.0}
    - {tx_gain: 76, dbm: 11.0}
