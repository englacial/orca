name: HIL Replay

# Software-only checks of the hardware-in-the-loop harness (tests/hil).
# Unit tests run on simulated captures; replay tests re-analyze the golden captures
# (assets of the release named in tests/hil/golden.yaml).

on:
  push:
  pull_request:

jobs:
  hil-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Conda Environment
        uses: conda-incubator/setup-miniconda@v2
        with:
          environment-file: environment-rpi.yaml
          activate-environment: uhd
          auto-activate-base: false

      - name: Install HIL Dependencies
        run: conda env update -n uhd -f environment-hil.yaml

      - name: Run HIL Unit Tests
        run: conda run -n uhd bash -c "PYTHONPATH=. pytest tests/hil/unit"

      - name: Restore Golden Captures
        uses: actions/cache@v4
        with:
          path: ~/.cache/orca-hil-golden
          key: hil-golden-${{ hashFiles('tests/hil/golden.yaml') }}

      - name: Replay Golden Captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: conda run -n uhd bash -c "PYTHONPATH=. pytest tests/hil/replay --replay"
